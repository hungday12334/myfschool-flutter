spring:
  datasource:
    url: jdbc:h2:mem:myfschool;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expiration-seconds: 3600
    issuer: myfschool-api-test
  cors:
    allowed-origin-patterns: http://localhost:*

logging:
  level:
    root: WARN
    com.example.myfschool: INFO
